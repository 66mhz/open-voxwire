name: History audit

# Pre-public-flip gate (BYT-122). CI scans only the working tree, but anything
# removed from the tree still ships in the commits that carried it. This scans
# EVERY commit on every ref. It is manual (not on PRs) because it judges the
# whole history, not a change — run it, and require it green, before any
# visibility change.
#
# It uses the generic, safe-to-name patterns only: the private denylist is
# maintainer-local and never given to CI (hit lines would land in run logs,
# which become world-readable once the repo is public). So also run
# `./scripts/leakcheck.sh --history` locally with the denylist present.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history:
    name: history scan (gitleaks + leakcheck)
    # GitHub-hosted, in a throwaway container, like every job here (see ci.yml).
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      - name: System packages (curl, git)
        run: apt-get update && apt-get install -y --no-install-recommends curl ca-certificates git

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, all branches

      # The checkout belongs to the runner's user and steps run as root, so git
      # refuses it ("dubious ownership"). gitleaks then scans nothing and still
      # reports "no leaks found"; leakcheck at least fails. Mark it safe, then
      # prove git can read the history before trusting either scan.
      - name: Let git read the checkout
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          commits=$(git rev-list --all --count)
          test "$commits" -gt 0
          echo "$commits commits on all refs to scan"

      - name: Install gitleaks
        run: |
          VERSION=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Gitleaks (full git history)
        run: gitleaks detect --redact --verbose --log-opts="--all"

      - name: Leak check (full git history)
        run: ./scripts/leakcheck.sh --history
